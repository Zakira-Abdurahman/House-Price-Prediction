# CI: run the test suite, then build the Docker image and smoke-test the running container.
# This is also where the Dockerfile itself gets validated - the sandbox this project was built in
# has no Docker daemon, so this workflow is the first place `docker build` actually runs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (pyflakes)
        run: |
          pip install pyflakes
          python -m pyflakes src app scripts tests

      - name: Run tests with coverage
        run: pytest -q --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    name: Build image and smoke-test container
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ethiopia-food-prices:ci .

      - name: Run container
        run: docker run -d --name dashboard -p 8501:8501 ethiopia-food-prices:ci

      - name: Wait for the app to become healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' dashboard 2>/dev/null || echo "starting")
            echo "attempt $i: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Container did not become healthy in time" >&2
          docker logs dashboard
          exit 1

      - name: Check the home page responds
        run: curl -sf http://localhost:8501/ -o /dev/null

      - name: Container logs (for debugging on failure)
        if: failure()
        run: docker logs dashboard

      - name: Stop container
        if: always()
        run: docker rm -f dashboard || true
